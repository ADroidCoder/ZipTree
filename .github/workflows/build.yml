# 测试，以及打包 macOS 安装包。
# - 推送分支、提交 PR：只跑测试
# - 在 Actions 页面手动运行：测试并打包，安装包在这次运行的 Artifacts 里下载
# - 推送 v 开头的标签（例如 v0.1.0）：测试并打包，全部成功后发布一个 Release，附上安装包
name: 打包

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ziptree-core --no-fail-fast

  build:
    name: 打包 (${{ matrix.name }})
    # 平时推代码只跑测试，打包很慢，只在发版和手动运行时做
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple 芯片)
            target: aarch64-apple-darwin
            arch: aarch64
          - name: macOS (Intel)
            target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-latest
    env:
      # 自动更新包的签名私钥，在仓库 Settings → Secrets and variables → Actions 里配置；没配置时只打普通安装包
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - name: 打包
        run: |
          args=(--target "${{ matrix.target }}")
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && args+=(--config src-tauri/tauri.updater.conf.json)
          npx tauri build "${args[@]}"
      - name: 更新包按架构改名
        run: |
          dir="target/${{ matrix.target }}/release/bundle/macos"
          if [ -f "$dir/ZipTree.app.tar.gz" ]; then
            mv "$dir/ZipTree.app.tar.gz" "$dir/ZipTree_${{ matrix.arch }}.app.tar.gz"
            mv "$dir/ZipTree.app.tar.gz.sig" "$dir/ZipTree_${{ matrix.arch }}.app.tar.gz.sig"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ZipTree-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # 下载下来会带着 dmg/、macos/ 这样的子目录，放到同一层才能上传
      - name: 把安装包放到同一层
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
      - name: 生成自动更新用的 latest.json
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          git log --no-merges --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" \
            | python3 .github/scripts/latest_json.py dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > latest.json \
            && mv latest.json dist/ || rm -f latest.json
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: ZipTree ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: dist/*
