<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8cff"/>
      <stop offset="1" stop-color="#1f5fd6"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ecfb"/>
    </linearGradient>
  </defs>
  <!-- macOS 图标网格：内容区 824×824，四周留白 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- 纸箱 -->
  <rect x="262" y="250" width="500" height="540" rx="56" fill="url(#box)"/>
  <!-- 拉链齿 -->
  <g fill="#1f5fd6">
    <rect x="470" y="250" width="42" height="36" rx="6"/>
    <rect x="512" y="300" width="42" height="36" rx="6"/>
    <rect x="470" y="350" width="42" height="36" rx="6"/>
    <rect x="512" y="400" width="42" height="36" rx="6"/>
    <rect x="470" y="450" width="42" height="36" rx="6"/>
  </g>
  <!-- 拉链头 -->
  <rect x="452" y="510" width="120" height="150" rx="30" fill="#1f5fd6"/>
  <rect x="487" y="560" width="50" height="70" rx="20" fill="#ffffff"/>
</svg>
