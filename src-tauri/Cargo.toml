[package]
name = "ziptree"
version = "0.1.1"
description = "免费、开源的解压缩工具"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "ziptree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ziptree-core = { path = "../crates/ziptree-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSPanel", "NSWindow", "NSResponder", "NSApplication"] }
objc2-quick-look-ui = { version = "0.3", features = ["QLPreviewPanel", "QLPreviewItem", "objc2-app-kit"] }
